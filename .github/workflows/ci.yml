name: AVISHKAR-v2 CI Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Code Quality, Automated Tests & Edge Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint Code Quality Checks
        run: npm run lint

      - name: Run Automated Test Suites (Unit & Integration)
        run: npm test

      - name: Verify Vinext Cloudflare Workers Edge Compilation
        run: npm run build:vinext
